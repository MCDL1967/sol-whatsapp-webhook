<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HP Fleet</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Syne+Mono&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --bg:#080b12; --s1:#0e1219; --s2:#141824; --s3:#1a2030;
  --border:#232c3d; --border2:#2e3a52;
  --cyan:#41d1ff; --blue:#7b9cff; --green:#3ddc84;
  --yellow:#ffc043; --red:#ff6b6b; --violet:#c084fc;
  --text:#dce6f5; --dim:#5a6a88; --dim2:#8899bb;
  --mono:'Syne Mono',monospace;
  --display:'Syne',sans-serif;
  --body:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;
  background-image:
    radial-gradient(ellipse 70% 50% at 15% 50%,rgba(65,209,255,.05) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 20%,rgba(123,156,255,.04) 0%,transparent 60%)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(65,209,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(65,209,255,.025) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%)}

/* ══════════════════════════════════════════
   LOGIN
══════════════════════════════════════════ */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--s1);border:1px solid var(--border2);border-top:3px solid var(--cyan);
  width:100%;max-width:420px;animation:up .35s cubic-bezier(.16,1,.3,1);position:relative}
.login-card::after{content:'';position:absolute;bottom:0;right:0;width:60px;height:60px;
  background:linear-gradient(135deg,transparent 50%,rgba(65,209,255,.06) 50%)}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.lc-head{padding:36px 36px 0;text-align:center}
.brand{font-family:var(--display);font-weight:800;font-size:28px;color:var(--text);
  letter-spacing:3px;display:flex;align-items:center;justify-content:center;gap:10px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.brand-ac{color:var(--cyan)}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:3px;
  text-transform:uppercase;margin-top:6px}
.lc-body{padding:32px 36px 36px}
.lc-title{font-family:var(--display);font-weight:700;font-size:15px;color:var(--text);margin-bottom:24px}
.lang-row{display:flex;justify-content:flex-end;margin-bottom:20px}
.lang-tog{display:flex;border:1px solid var(--border2);border-radius:2px;overflow:hidden}
.lang-tog button{font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:5px 12px;
  background:transparent;border:none;color:var(--dim);cursor:pointer;transition:all .15s}
.lang-tog button.active{background:var(--s3);color:var(--cyan)}
.err-box{background:rgba(255,107,107,.09);border:1px solid rgba(255,107,107,.3);
  border-left:3px solid var(--red);padding:10px 14px;font-family:var(--mono);font-size:11px;
  color:var(--red);margin-bottom:18px;display:none}
.err-box.on{display:block}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.field label{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim2)}
.field input{background:var(--s2);border:1px solid var(--border2);color:var(--text);
  font-family:var(--body);font-size:14px;padding:11px 14px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--cyan)}
.field input::placeholder{color:var(--dim)}
.field .ferr{font-family:var(--mono);font-size:9px;color:var(--red);margin-top:3px;display:none}
.field .ferr.on{display:block}
.field input.err{border-color:var(--red)}
.btn-login{width:100%;font-family:var(--display);font-weight:700;font-size:13px;
  letter-spacing:2px;text-transform:uppercase;padding:14px;background:var(--cyan);
  color:#000;border:none;cursor:pointer;transition:all .2s;margin-top:4px;position:relative;overflow:hidden}
.btn-login::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
  transform:translateX(-100%);transition:transform .4s}
.btn-login:hover::after{transform:translateX(100%)}
.btn-login:hover{background:#7be8ff;transform:translateY(-1px)}
.lc-foot{border-top:1px solid var(--border);padding:14px 36px;font-family:var(--mono);
  font-size:9px;color:var(--dim);display:flex;align-items:center;justify-content:space-between;letter-spacing:.5px}
.cf-dot{width:5px;height:5px;border-radius:50%;background:var(--green)}

/* ══════════════════════════════════════════
   APP SHELL
══════════════════════════════════════════ */
#appShell{display:none;min-height:100vh;flex-direction:column}

/* TOPBAR */
.topbar{background:var(--s1);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:stretch;height:54px;
  position:sticky;top:0;z-index:50;flex-shrink:0}
.tb-logo{font-family:var(--display);font-weight:800;font-size:16px;color:var(--cyan);
  display:flex;align-items:center;gap:8px;padding-right:20px;
  border-right:1px solid var(--border);letter-spacing:1px;flex-shrink:0}
.tb-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 2s infinite}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.tb-user-info{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.tb-name{font-family:var(--display);font-weight:600;font-size:13px;color:var(--text)}
.tb-role-label{font-family:var(--mono);font-size:9px;color:var(--dim2);letter-spacing:1px;text-transform:uppercase}
.tb-avatar{width:32px;height:32px;border-radius:50%;background:var(--s3);
  border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:12px}
.btn-signout{font-family:var(--mono);font-size:10px;padding:6px 12px;background:transparent;
  border:1px solid var(--border2);color:var(--dim2);cursor:pointer;border-radius:2px;
  transition:all .15s;letter-spacing:.5px}
.btn-signout:hover{border-color:var(--red);color:var(--red)}

/* TAB NAV */
.tab-nav{background:var(--s1);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:stretch;gap:0;flex-shrink:0}
.tab-btn{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;
  padding:0 20px;height:44px;background:transparent;border:none;border-bottom:2px solid transparent;
  color:var(--dim2);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px;
  white-space:nowrap}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.tab-icon{font-size:14px}

/* ROLE BANNER */
.role-banner{margin:20px 24px 0;border:1px solid var(--border2);
  border-left:3px solid;padding:14px 18px;display:flex;align-items:flex-start;gap:14px;
  animation:up .3s ease}
.rb-admin  {border-left-color:var(--violet);background:rgba(192,132,252,.05)}
.rb-operator{border-left-color:var(--cyan);background:rgba(65,209,255,.05)}
.rb-reviewer{border-left-color:var(--green);background:rgba(61,220,132,.05)}
.rb-readonly{border-left-color:var(--dim2);background:rgba(136,153,187,.05)}
.rb-icon{font-size:22px;flex-shrink:0;margin-top:1px}
.rb-content{}
.rb-role{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;
  margin-bottom:4px}
.rb-admin .rb-role  {color:var(--violet)}
.rb-operator .rb-role{color:var(--cyan)}
.rb-reviewer .rb-role{color:var(--green)}
.rb-readonly .rb-role{color:var(--dim2)}
.rb-name{font-family:var(--display);font-weight:700;font-size:16px;color:var(--text);margin-bottom:6px}
.rb-desc{font-size:13px;color:var(--dim2);line-height:1.6}
.rb-perms{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.perm-tag{font-family:var(--mono);font-size:9px;letter-spacing:.5px;
  padding:3px 8px;border-radius:2px;border:1px solid}
.pt-ok {color:var(--green);border-color:rgba(61,220,132,.3);background:rgba(61,220,132,.08)}
.pt-no {color:var(--dim);border-color:var(--border);background:transparent;text-decoration:line-through}

/* TAB CONTENT */
.tab-content{flex:1;padding:24px;max-width:1200px;margin:0 auto;width:100%}
.tab-panel{display:none;animation:up .2s ease}
.tab-panel.active{display:block}

/* ══════════════════════════════════════════
   USER ADMIN TAB
══════════════════════════════════════════ */
.page-hdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-family:var(--display);font-weight:800;font-size:22px;color:var(--text)}
.page-title span{color:var(--cyan)}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.scard{background:var(--s1);border:1px solid var(--border);padding:14px;position:relative;overflow:hidden}
.scard::after{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sc-admin::after{background:var(--violet)} .sc-op::after{background:var(--cyan)}
.sc-rev::after{background:var(--green)} .sc-ro::after{background:var(--dim2)}
.sc-tot::after{background:var(--blue)}
.sc-l{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:5px}
.sc-v{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--text)}
.sc-s{font-family:var(--mono);font-size:9px;color:var(--dim2);margin-top:4px}

/* Filters */
.filters{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.f-wrap{position:relative}
.f-select{background:var(--s2);border:1px solid var(--border2);color:var(--text);
  font-family:var(--mono);font-size:11px;padding:7px 28px 7px 10px;border-radius:2px;
  cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;min-width:150px}
.f-select:focus{border-color:var(--cyan)}
.f-wrap::after{content:'▾';position:absolute;right:9px;top:50%;transform:translateY(-50%);
  color:var(--dim2);pointer-events:none;font-size:10px}
.f-select option{background:var(--s2)}
.search-inp{background:var(--s2);border:1px solid var(--border2);color:var(--text);
  font-family:var(--body);font-size:13px;padding:7px 12px;border-radius:2px;
  outline:none;transition:border-color .15s;min-width:200px}
.search-inp:focus{border-color:var(--cyan)}
.search-inp::placeholder{color:var(--dim)}
.f-count{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto}

/* User table */
.tbl-wrap{border:1px solid var(--border);overflow:hidden;margin-bottom:20px}
.utbl{width:100%;border-collapse:collapse}
.utbl thead tr{background:var(--s2);border-bottom:2px solid var(--border2)}
.utbl thead th{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--dim2);padding:10px 14px;text-align:left;white-space:nowrap;
  border-right:1px solid var(--border)}
.utbl thead th:last-child{border-right:none}
.utbl tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
.utbl tbody tr:hover{background:rgba(255,255,255,.012)}
.utbl tbody tr.row-inactive{opacity:.45}
.utbl td{padding:11px 14px;vertical-align:middle;border-right:1px solid var(--border);font-size:13px}
.utbl td:last-child{border-right:none}
.u-cell{display:flex;align-items:center;gap:10px}
.u-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:12px;flex-shrink:0;border:1px solid var(--border2)}
.u-name{font-family:var(--display);font-weight:600;font-size:13px;color:var(--text)}
.u-email{font-family:var(--mono);font-size:10px;color:var(--dim2);margin-top:1px}
.role-chip{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;
  padding:3px 8px;border-radius:2px;border:1px solid;display:inline-flex;align-items:center;gap:4px}
.rc-admin  {color:var(--violet);border-color:rgba(192,132,252,.4);background:rgba(192,132,252,.08)}
.rc-operator{color:var(--cyan);border-color:rgba(65,209,255,.4);background:rgba(65,209,255,.08)}
.rc-reviewer{color:var(--green);border-color:rgba(61,220,132,.4);background:rgba(61,220,132,.08)}
.rc-readonly{color:var(--dim2);border-color:rgba(136,153,187,.4);background:rgba(136,153,187,.08)}
.sp{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;
  letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:2px;border:1px solid;
  cursor:pointer;transition:all .15s;background:transparent}
.sp-on{color:var(--green);border-color:rgba(61,220,132,.4)}
.sp-on:hover{background:rgba(61,220,132,.1)}
.sp-on::before{content:'●';font-size:7px}
.sp-off{color:var(--dim);border-color:var(--border2)}
.sp-off:hover{background:var(--s3)}
.sp-off::before{content:'○';font-size:7px}
.act-cell{display:flex;gap:6px;align-items:center}
.btn-sm{font-family:var(--mono);font-size:9px;letter-spacing:.5px;padding:5px 10px;
  background:transparent;border:1px solid var(--border2);color:var(--dim2);
  cursor:pointer;border-radius:2px;transition:all .15s}
.btn-sm:hover{border-color:var(--text);color:var(--text)}
.btn-sm.del:hover{border-color:var(--red);color:var(--red)}
.btn-sm:disabled{opacity:.3;cursor:not-allowed}

/* Audit log */
.audit-wrap{border:1px solid var(--border);max-height:260px;overflow-y:auto}
.ae{display:flex;align-items:flex-start;gap:12px;padding:9px 14px;
  border-bottom:1px solid var(--border);font-size:12px}
.ae:last-child{border-bottom:none}
.ae:hover{background:rgba(255,255,255,.01)}
.ae-ts{font-family:var(--mono);font-size:9px;color:var(--dim);white-space:nowrap;
  padding-top:1px;min-width:110px}
.ae-body{flex:1;line-height:1.5}
.ae-actor{font-family:var(--display);font-weight:600;color:var(--cyan);margin-right:4px}
.ae-action{color:var(--dim2)}
.ae-target{color:var(--text);font-weight:500}
.audit-empty{padding:20px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim)}

/* ══════════════════════════════════════════
   BITACORA TAB placeholder
══════════════════════════════════════════ */
.coming-soon{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:400px;gap:16px;text-align:center}
.cs-icon{font-size:48px;opacity:.4}
.cs-title{font-family:var(--display);font-weight:700;font-size:20px;color:var(--text)}
.cs-sub{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:1px}

/* ══════════════════════════════════════════
   BUTTONS
══════════════════════════════════════════ */
.btn-primary{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:1px;
  text-transform:uppercase;padding:10px 22px;background:var(--cyan);color:#000;
  border:none;cursor:pointer;border-radius:2px;transition:all .2s}
.btn-primary:hover{background:#7be8ff;transform:translateY(-1px)}
.btn-ghost{font-family:var(--mono);font-size:11px;padding:8px 16px;background:transparent;
  border:1px solid var(--border2);color:var(--dim2);cursor:pointer;border-radius:2px;transition:all .15s}
.btn-ghost:hover{border-color:var(--text);color:var(--text)}
.btn-danger{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:1px;
  text-transform:uppercase;padding:10px 20px;background:var(--red);color:#fff;
  border:none;cursor:pointer;border-radius:2px;transition:all .2s}
.btn-danger:hover{background:#ff8f8f}

/* ══════════════════════════════════════════
   MODALS
══════════════════════════════════════════ */
.mbd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);
  backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px}
.mbd.open{display:flex}
.mbox{background:var(--s1);border:1px solid var(--border2);width:100%;
  max-height:90vh;overflow-y:auto;animation:up .2s ease}
.mbox.edit{max-width:500px;border-top:2px solid var(--cyan)}
.mbox.del{max-width:420px;border-top:2px solid var(--red)}
.mhdr{display:flex;align-items:center;justify-content:space-between;
  padding:15px 20px;border-bottom:1px solid var(--border)}
.mhdr-t{font-family:var(--display);font-weight:700;font-size:15px}
.mhdr-t.ct{color:var(--cyan)} .mhdr-t.cr{color:var(--red)}
.m-x{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:4px;
  line-height:1;transition:color .15s}
.m-x:hover{color:var(--text)}
.mbody{padding:20px}
.mftr{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.fg-title{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:var(--dim);margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px}
.fg-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.frow{display:grid;gap:10px;margin-bottom:10px}
.fc2{grid-template-columns:1fr 1fr} .fc1{grid-template-columns:1fr}
.del-warn{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3);
  border-left:3px solid var(--red);padding:12px 14px;font-size:13px;line-height:1.7;color:var(--text)}
.del-warn strong{color:var(--red);font-family:var(--mono)}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--s2);
  border:1px solid var(--border2);border-left:3px solid var(--green);
  padding:10px 16px;font-family:var(--mono);font-size:11px;color:var(--text);
  z-index:9999;transform:translateX(130%);transition:transform .3s ease;
  max-width:300px;border-radius:2px}
.toast.on{transform:translateX(0)}
.toast.warn{border-left-color:var(--yellow)}
.toast.err{border-left-color:var(--red)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

@media(max-width:768px){
  .tab-content{padding:16px}
  .stats-row{grid-template-columns:1fr 1fr}
  .utbl td:nth-child(4),.utbl th:nth-child(4){display:none}
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     LOGIN SCREEN
══════════════════════════════════════════ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="lc-head">
      <div class="brand"><div class="brand-dot"></div>HP<span class="brand-ac">·</span>FLEET</div>
      <div class="brand-sub">Flight Operations Platform</div>
    </div>
    <div class="lc-body">
      <div class="lang-row">
        <div class="lang-tog">
          <button id="btnEN" class="active" onclick="setLang('en')">EN</button>
          <button id="btnES" onclick="setLang('es')">ES</button>
        </div>
      </div>
      <div class="lc-title" id="loginTitle">Sign In</div>
      <div class="err-box" id="loginErr"></div>
      <div class="field">
        <label id="lbl_user">Email / Username</label>
        <input type="text" id="li_user" placeholder="you@hp-fleet.com" autocomplete="username">
      </div>
      <div class="field">
        <label id="lbl_pass">Password</label>
        <input type="password" id="li_pass" placeholder="••••••••"
          autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-login" onclick="doLogin()">
        <span id="loginBtnTxt">Sign In</span>
      </button>
    </div>
    <div class="lc-foot">
      <div style="display:flex;align-items:center;gap:6px"><div class="cf-dot"></div>HP Fleet v1.0</div>
      <span>© 2025 ICTLabs</span>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     APP SHELL
══════════════════════════════════════════ -->
<div id="appShell" style="display:none;flex-direction:column;min-height:100vh">

  <!-- Topbar -->
  <div class="topbar">
    <div class="tb-logo"><div class="tb-dot"></div>HP<span style="color:var(--cyan)">·</span>FLEET</div>
    <div class="tb-right">
      <div class="lang-tog" style="margin-right:4px">
        <button id="appBtnEN" class="active" onclick="setLang('en')">EN</button>

function doLogin(){
  const email = document.getElementById("li_user").value.trim();
  const pwd   = document.getElementById("li_pass").value;
  const err   = document.getElementById("loginErr");
  const btn   = document.getElementById("loginBtnTxt");
  err.classList.remove("on");
  btn.textContent = t("signingIn");

  setTimeout(()=>{
    const user = USERS.find(u=>u.email===email && u.pwd===pwd);
    if(!user || user.status!=="active"){
      err.textContent = !user ? t("loginErr") : t("inactiveErr");
      err.classList.add("on");
      btn.textContent = t("signIn");
      return;
    }
    user.lastLogin = new Date().toISOString();
    currentUser = user;
    addAudit("🔑", user.name, t("logLoggedIn"), "—");
    bootApp();
  },400);
}

function doLogout(){
  addAudit("🚪", currentUser.name, t("logLoggedOut"), "—");
  currentUser = null;
  document.getElementById("appShell").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("li_user").value = "";
  document.getElementById("li_pass").value = "";
  document.getElementById("loginErr").classList.remove("on");
  document.getElementById("loginBtnTxt").textContent = t("signIn");
}

function bootApp(){
  document.getElementById("loginScreen").style.display = "none";
  const shell = document.getElementById("appShell");
  shell.style.display = "flex";

  document.getElementById("tbName").textContent = currentUser.name;
  document.getElementById("tbRoleLabel").textContent = ROLES[currentUser.role][lang].label;
  document.getElementById("tbAvatar").textContent = initials(currentUser.name);
  document.getElementById("tbAvatar").style.color = ROLES[currentUser.role].color;

  applyAppI18n();
  renderTabs();
  renderRoleBanner();
  renderStats();
  renderUsers();
  renderAudit();

  const defaultTab = currentUser.role==="ADMIN" ? "users" : "bitacora";
  switchTab(defaultTab);
}

// ══════════════════════════════════════════════════════════════
function renderTabs(){
  const nav = document.getElementById("tabNav");
  nav.innerHTML = "";
  const tabs = [];
  if(currentUser.role === "ADMIN") tabs.push({id:"users", icon:"👥", label:t("tabUsers")});
  tabs.push({id:"bitacora", icon:"✈️", label:t("tabBitacora")});

  tabs.forEach(tab=>{
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (activeTab===tab.id?" active":"");
    btn.innerHTML = `<span class="tab-icon">${tab.icon}</span>${tab.label}`;
    btn.onclick = ()=>switchTab(tab.id);
    nav.appendChild(btn);
  });
}

function switchTab(id){
  activeTab = id;
  document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
  const panel = document.getElementById("panel-"+id);
  if(panel) panel.classList.add("active");
  renderTabs();
}

  document.getElementById("roleBanner").innerHTML = `
    <div class="role-banner ${r.bannerClass}" style="margin:20px 24px 0">
      <div class="rb-icon">${r.icon}</div>
      <div class="rb-content">

        <div class="rb-name">${currentUser.name}</div>
        <div class="rb-desc">${rd.desc}</div>
        <div class="rb-perms">${permsHtml}</div>
      </div>
    </div>`;
}

  roles.forEach(r=>{
    const cnt=USERS.filter(u=>u.role===r).length;
    const act=USERS.filter(u=>u.role===r&&u.status==="active").length;
    html+=`<div class="scard ${cls[r]}">
      <div class="sc-l">${ROLES[r][lang].label}</div>
      <div class="sc-v">${cnt}</div>
      <div class="sc-s">${act} ${t("statsActive")}</div>
    </div>`;
  });
  document.getElementById("userStats").innerHTML = html;
}

// ══════════════════════════════════════════════════════════════
// USER TABLE
// ══════════════════════════════════════════════════════════════
function getFiltered(){
  const q = document.getElementById("userSearch").value.toLowerCase();
  const r = document.getElementById("filterRole").value;
  const s = document.getElementById("filterStatus").value;
  return USERS.filter(u=>{
    const mq = !q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
    const mr = r==="ALL" || u.role===r;
    const ms = s==="ALL" || u.status===s;
    return mq && mr && ms;
  });
}

function renderUsers(){
  const list = getFiltered();
  document.getElementById("userCount").textContent =
    `${t("showing")} ${list.length} ${t("of")} ${USERS.length} ${t("users")}`;
  const tbody = document.getElementById("userTbody");
  if(!list.length){
    tbody.innerHTML=`<tr><td colspan="6" style="text-align:center;padding:24px;
      font-family:var(--mono);font-size:11px;color:var(--dim)">${t("noResults")}</td></tr>`;
    return;
  }
  tbody.innerHTML="";
  list.forEach(u=>{
    const r = ROLES[u.role];
    const isSelf = currentUser && u.id===currentUser.id;
    const tr = document.createElement("tr");
    tr.className = u.status==="inactive"?"row-inactive":"";
    tr.innerHTML=`
      <td>
        <div class="u-cell">
          <div class="u-av" style="background:${r.avatarBg};color:${r.color}">${initials(u.name)}</div>
          <div>
            <div class="u-name">${u.name}${isSelf?` <span style="font-family:var(--mono);font-size:9px;color:var(--dim)">(me)</span>`:""}</div>
            <div class="u-email">${u.email}</div>
          </div>
        </div>
      </td>
      <td><span class="role-chip ${r.chipClass}">${r[lang].label}</span></td>
      <td>
        <button class="sp ${u.status==="active"?"sp-on":"sp-off"}"
          onclick="toggleStatus('${u.id}')" ${isSelf?"disabled":""}>
          ${u.status==="active"?t("active"):t("inactive")}
        </button>
      </td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--dim2)">${u.created||"—"}</td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--dim2)">
        ${u.lastLogin ? new Date(u.lastLogin).toLocaleString(lang==="es"?"es-PA":"en-US") : t("never")}
      </td>
      <td>
        <div class="act-cell">
          <button class="btn-sm" onclick="openEditUser('${u.id}')">${t("edit")}</button>
          <button class="btn-sm del" onclick="openDeleteUser('${u.id}')"
            ${isSelf?"disabled":""}>${t("del")}</button>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });
}

// ══════════════════════════════════════════════════════════════
// STATUS TOGGLE
// ══════════════════════════════════════════════════════════════
function toggleStatus(id){
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  if(currentUser.id===id){ showToast(t("cantDeactivateSelf"),"err"); return; }
  u.status = u.status==="active"?"inactive":"active";
  addAudit("🔄", currentUser.name, t("logToggled"), `${u.name} → ${t(u.status)}`);
  renderUsers(); renderStats();
  showToast(t("statusUpdated"));
}

// ══════════════════════════════════════════════════════════════
// CREATE / EDIT USER
// ══════════════════════════════════════════════════════════════
function openCreateUser(){
  editingId = null;
  clearFormErrs();
  document.getElementById("umTitle").textContent = t("umNewTitle");
  document.getElementById("um_name").value = "";
  document.getElementById("um_email").value = "";
  document.getElementById("um_role").value = "OPERATOR";
  document.getElementById("um_status").value = "active";
  document.getElementById("um_pwd").value = "";
  document.getElementById("um_lbl_pwd").textContent = t("umPwd");
  updateRolePreview();
  openModal("userMbd");
}

function openEditUser(id){
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  editingId = id;
  clearFormErrs();
  document.getElementById("umTitle").textContent = t("umEditTitle")+": "+u.name;
  document.getElementById("um_name").value = u.name;
  document.getElementById("um_email").value = u.email;
  document.getElementById("um_role").value = u.role;
  document.getElementById("um_status").value = u.status;
  document.getElementById("um_pwd").value = "";
  document.getElementById("um_lbl_pwd").textContent = t("umPwdEdit");
  updateRolePreview();
  openModal("userMbd");
}

function updateRolePreview(){
  const role = document.getElementById("um_role").value;
  document.getElementById("rolePreview").textContent = t("rolePreview")[role]||"";
}
document.getElementById("um_role").addEventListener("change", updateRolePreview);

function saveUser(){
  clearFormErrs();
  const name   = document.getElementById("um_name").value.trim();
  const email  = document.getElementById("um_email").value.trim();
  const role   = document.getElementById("um_role").value;
  const status = document.getElementById("um_status").value;
  const pwd    = document.getElementById("um_pwd").value;
  let ok = true;

  if(!name)  { setFerr("ume_name","um_name",t("required")); ok=false; }
  if(!email) { setFerr("ume_email","um_email",t("required")); ok=false; }
  else {
    const dup = USERS.find(u=>u.email===email && u.id!==editingId);
    if(dup){ setFerr("ume_email","um_email",t("emailExists")); ok=false; }
  }
  if(!editingId && pwd.length<6){ setFerr("ume_pwd","um_pwd",t("pwdShort")); ok=false; }
  if(editingId && pwd && pwd.length<6){ setFerr("ume_pwd","um_pwd",t("pwdShort")); ok=false; }
  if(!ok) return;

  if(editingId){
    const u = USERS.find(x=>x.id===editingId);
    const changes=[];
    if(u.name!==name) changes.push(`name→"${name}"`);
    if(u.role!==role) changes.push(`role→${ROLES[role][lang].label}`);
    if(u.status!==status) changes.push(`status→${t(status)}`);
    if(pwd) changes.push("password updated");
    u.name=name; u.email=email; u.role=role; u.status=status;
    if(pwd) u.pwd=pwd;
    addAudit("✏️", currentUser.name, t("logEdited"), u.name+(changes.length?" ("+changes.join(", ")+")":""));
    showToast(t("userUpdated"));
  } else {
    const nu = {id:"u"+Date.now()+nextId++,name,email,pwd,role,status,
      created:new Date().toISOString().slice(0,10),lastLogin:null};
    USERS.push(nu);
    addAudit("➕", currentUser.name, t("logCreated"), `${name} (${email}) — ${ROLES[role][lang].label}`);
    showToast(t("userCreated"));
  }
  closeModal("userMbd");
  renderUsers(); renderStats();
}

// ══════════════════════════════════════════════════════════════
// DELETE
// ══════════════════════════════════════════════════════════════
function openDeleteUser(id){
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  if(currentUser.id===id){ showToast(t("cantDelSelf"),"err"); return; }
  deletingId = id;
  document.getElementById("delWarn").innerHTML =
    `${t("delWarn1")} <strong>${u.name}</strong> (${u.email})${t("delWarn2")}`;
  openModal("delMbd");
}

function confirmDelete(){
  const u = USERS.find(x=>x.id===deletingId);
  if(!u) return;
  const idx = USERS.indexOf(u);
  USERS.splice(idx,1);
  addAudit("🗑️", currentUser.name, t("logDeleted"), `${u.name} (${u.email})`);
  closeModal("delMbd");
  deletingId = null;
  renderUsers(); renderStats();
  showToast(t("userDeleted"),"warn");
}

// ══════════════════════════════════════════════════════════════
// EXPORT JSON
// ══════════════════════════════════════════════════════════════
function exportUsersJSON(){
  const safe = USERS.map(u=>({...u, pwd:"[REDACTED]"}));
  const blob = new Blob([JSON.stringify(safe,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hp_fleet_users.json";
  a.click();
  showToast("↓ users.json exported");
}

// ══════════════════════════════════════════════════════════════
// AUDIT LOG
// ══════════════════════════════════════════════════════════════
function addAudit(icon,actor,action,target){
  auditLog.unshift({icon,actor,action,target,ts:new Date()});
  if(auditLog.length>300) auditLog=auditLog.slice(0,300);
  renderAudit();
}

function renderAudit(){
  const el = document.getElementById("auditList");
  if(!auditLog.length){
    el.innerHTML=`<div class="audit-empty">${t("utNoAudit")}</div>`; return;
  }
  el.innerHTML = auditLog.map(e=>`
    <div class="ae">
      <div class="ae-ts">${e.ts.toLocaleTimeString(lang==="es"?"es-PA":"en-US",
        {hour:"2-digit",minute:"2-digit",second:"2-digit"})}<br>
        ${e.ts.toLocaleDateString(lang==="es"?"es-PA":"en-US")}</div>
      <div style="font-size:14px;flex-shrink:0">${e.icon}</div>
      <div class="ae-body">
        <span class="ae-actor">${e.actor}</span>
        <span class="ae-action"> ${e.action} </span>
        <span class="ae-target">${e.target!=="—"?e.target:""}</span>
      </div>
    </div>`).join("");
}

function clearAudit(){
  auditLog=[];
  renderAudit();
  showToast(lang==="es"?"Log limpiado.":"Log cleared.");
}

// ══════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════
function initials(name){
  return name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
}
function openModal(id){ document.getElementById(id).classList.add("open"); }
function closeModal(id){ document.getElementById(id).classList.remove("open"); }
function bdClose(e,id){ if(e.target===document.getElementById(id)) closeModal(id); }
function clearFormErrs(){
  ["name","email","pwd"].forEach(f=>{
    const e=document.getElementById("ume_"+f);
    const i=document.getElementById("um_"+f);
    if(e){e.textContent="";e.classList.remove("on");}
    if(i) i.classList.remove("err");
  });
}
function setFerr(errId,inputId,msg){
  const e=document.getElementById(errId);
  e.textContent=msg; e.classList.add("on");
  document.getElementById(inputId)?.classList.add("err");
}
function showToast(msg,type=""){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.className="toast on"+(type?" "+type:"");
  setTimeout(()=>t.className="toast",3200);
}

// INIT
applyLoginI18n();
</script>
