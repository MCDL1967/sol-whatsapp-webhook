<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HP Fleet</title>
<script src="shared/auth.js"></script>
<script src="shared/i18n.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Syne+Mono&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --bg:#080b12; --s1:#0e1219; --s2:#141824; --s3:#1a2030;
  --border:#232c3d; --border2:#2e3a52;
  --cyan:#41d1ff; --blue:#7b9cff; --green:#3ddc84;
  --yellow:#ffc043; --red:#ff6b6b; --violet:#c084fc;
  --text:#dce6f5; --dim:#5a6a88; --dim2:#8899bb;
  --mono:'Syne Mono',monospace;
  --display:'Syne',sans-serif;
  --body:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body {
  background:var(--bg);color:var(--text);font-family:var(--body);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-image:
    radial-gradient(ellipse 70% 50% at 15% 50%,rgba(65,209,255,.06) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 20%,rgba(123,156,255,.05) 0%,transparent 60%),
    radial-gradient(ellipse 40% 60% at 50% 100%,rgba(61,220,132,.03) 0%,transparent 60%);
}

/* ── GRID LINES background ── */
body::before {
  content:'';position:fixed;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(65,209,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(65,209,255,.03) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%);
}

/* ── CARD ── */
.card {
  background:var(--s1);border:1px solid var(--border2);
  border-top:3px solid var(--cyan);width:100%;max-width:420px;
  margin:20px;animation:up .35s cubic-bezier(.16,1,.3,1);
  position:relative;
}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* decorative corner */
.card::after {
  content:'';position:absolute;bottom:0;right:0;
  width:60px;height:60px;
  background:linear-gradient(135deg,transparent 50%,rgba(65,209,255,.06) 50%);
}

/* ── HEADER ── */
.card-header {padding:36px 36px 0;text-align:center}
.brand {
  font-family:var(--display);font-weight:800;font-size:28px;
  color:var(--text);letter-spacing:3px;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.brand-dot {
  width:8px;height:8px;border-radius:50%;background:var(--cyan);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.brand-accent {color:var(--cyan)}
.brand-sub {
  font-family:var(--mono);font-size:10px;color:var(--dim);
  letter-spacing:3px;text-transform:uppercase;margin-top:6px;
}

/* ── BODY ── */
.card-body {padding:32px 36px 36px}
.card-title {
  font-family:var(--display);font-weight:700;font-size:15px;
  color:var(--text);margin-bottom:24px;
}

/* ── LANG ── */
.lang-row {
  display:flex;justify-content:flex-end;margin-bottom:20px;
}
.lang-toggle {
  display:flex;border:1px solid var(--border2);border-radius:2px;overflow:hidden;
}
.lang-toggle button {
  font-family:var(--mono);font-size:10px;letter-spacing:1px;
  padding:5px 12px;background:transparent;border:none;
  color:var(--dim);cursor:pointer;transition:all .15s;
}
.lang-toggle button.active{background:var(--s3);color:var(--cyan)}

/* ── ERROR ── */
.err-box {
  background:rgba(255,107,107,.09);border:1px solid rgba(255,107,107,.3);
  border-left:3px solid var(--red);padding:10px 14px;
  font-family:var(--mono);font-size:11px;color:var(--red);
  margin-bottom:18px;display:none;
}
.err-box.on{display:block}

/* ── FIELDS ── */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.field label{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim2)}
.field input {
  background:var(--s2);border:1px solid var(--border2);color:var(--text);
  font-family:var(--body);font-size:14px;padding:11px 14px;
  outline:none;transition:border-color .15s;
}
.field input:focus{border-color:var(--cyan)}
.field input::placeholder{color:var(--dim)}

/* ── BUTTON ── */
.btn-login {
  width:100%;font-family:var(--display);font-weight:700;font-size:13px;
  letter-spacing:2px;text-transform:uppercase;padding:14px;
  background:var(--cyan);color:#000;border:none;cursor:pointer;
  transition:all .2s;margin-top:4px;position:relative;overflow:hidden;
}
.btn-login::after {
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
  transform:translateX(-100%);transition:transform .4s;
}
.btn-login:hover::after{transform:translateX(100%)}
.btn-login:hover{background:#7be8ff;transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}

/* ── FOOTER ── */
.card-footer {
  border-top:1px solid var(--border);padding:14px 36px;
  font-family:var(--mono);font-size:9px;color:var(--dim);
  display:flex;align-items:center;justify-content:space-between;
  letter-spacing:.5px;
}
.cf-dot{width:5px;height:5px;border-radius:50%;background:var(--green)}
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="brand">
      <div class="brand-dot"></div>
      HP<span class="brand-accent">·</span>FLEET
    </div>
    <div class="brand-sub">Flight Operations Platform</div>
  </div>

  <div class="card-body">
    <div class="lang-row">
      <div class="lang-toggle">
        <button id="btnEN" class="active" onclick="setLang('en')">EN</button>
        <button id="btnES" onclick="setLang('es')">ES</button>
      </div>
    </div>

    <div class="card-title" data-i18n="signIn">Sign In</div>

    <div class="err-box" id="errBox"></div>

    <div class="field">
      <label data-i18n="username">Email / Username</label>
      <input type="text" id="f_user" data-i18n-placeholder="username"
        placeholder="Email / Username" autocomplete="username">
    </div>

    <div class="field">
      <label data-i18n="password">Password</label>
      <input type="password" id="f_pass" placeholder="••••••••"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>

    <button class="btn-login" onclick="doLogin()">
      <span id="loginBtnTxt" data-i18n="signIn">Sign In</span>
    </button>
  </div>

  <div class="card-footer">
    <div style="display:flex;align-items:center;gap:6px">
      <div class="cf-dot"></div>
      <span>HP Fleet v1.0</span>
    </div>
    <span>© 2025 UNIDAD FRAGATA 01</span>
  </div>
</div>

<script>
function setLang(l) {
  HPFLEET_I18N.lang = l;
  document.getElementById('btnEN').className = l==='en'?'active':'';
  document.getElementById('btnES').className = l==='es'?'active':'';
  HPFLEET_I18N.applyToDOM();
}

function doLogin() {
  const email = document.getElementById('f_user').value.trim();
  const pwd   = document.getElementById('f_pass').value;
  const err   = document.getElementById('errBox');
  const btn   = document.getElementById('loginBtnTxt');

  err.classList.remove('on');
  btn.textContent = HPFLEET_I18N.t('signingIn');

  setTimeout(() => {
    const user = HPFLEET_AUTH.login(email, pwd);

    if (!user) {
      // check if account exists but is inactive
      const exists = HPFLEET_AUTH.getUsers ? null : null;
      err.textContent = HPFLEET_I18N.t('loginError');
      err.classList.add('on');
      btn.textContent = HPFLEET_I18N.t('signIn');
      return;
    }

    // Route by role
    const routes = {
      ADMIN:    'modules/user-admin/index.html',
      OPERATOR: 'modules/bitacora-review/index.html',
      REVIEWER: 'modules/bitacora-review/index.html',
      READONLY: 'modules/bitacora-review/index.html',
    };

    // Pass session via sessionStorage so modules can read it
    sessionStorage.setItem('hpfleet_user', JSON.stringify(user));
    sessionStorage.setItem('hpfleet_lang', HPFLEET_I18N.lang);

    window.location.href = routes[user.role] || 'modules/bitacora-review/index.html';
  }, 400);
}

// Read lang preference if returning
const savedLang = sessionStorage.getItem('hpfleet_lang');
if (savedLang) setLang(savedLang);
HPFLEET_I18N.applyToDOM();
</script>
</body>
</html>
