services:
  - type: web
    name: hp-fleet
    env: static
    branch: personal/hp-fleet
    rootDir: Personal/hp-fleet
    buildCommand: echo "No build step required"
    staticPublishPath: .
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-eval' https://cdnjs.cloudflare.com; connect-src 'self' https://api.anthropic.com https://merarvfkbevvdbtghhfs.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:"
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
