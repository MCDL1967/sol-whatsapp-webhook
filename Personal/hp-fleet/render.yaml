services:

  - type: web

    name: hp-fleet

    env: static

    branch: personal/hp-fleet

    rootDir: Personal/hp-fleet

    buildCommand: echo "No build step required"

    staticPublishPath: .

    headers:

      - path: /*

        name: X-Frame-Options

        value: SAMEORIGIN

      - path: /*

        name: X-Content-Type-Options

        value: nosniff

    routes:

      - type: rewrite

        source: /*

        destination: /index.html
